<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Font Sample</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Noto+Sans+JP:wght@400&family=Poppins:wght@700&family=M+PLUS+Rounded+1c:wght@400&family=Playfair+Display:wght@700&family=Noto+Serif+JP:wght@400&display=swap" rel="stylesheet">
  <style>
    .montserrat { font-family: 'Montserrat', 'Noto Sans JP', sans-serif; }
    .noto-sans { font-family: 'Noto Sans JP', sans-serif; }
    .poppins { font-family: 'Poppins', 'M PLUS Rounded 1c', sans-serif; }
    .rounded { font-family: 'M PLUS Rounded 1c', sans-serif; }
    .playfair { font-family: 'Playfair Display', 'Noto Serif JP', serif; }
    .noto-serif { font-family: 'Noto Serif JP', serif; }
  </style>
</head>
<body>
  <h1 class="montserrat">Montserrat 見出しサンプル</h1>
  <p class="noto-sans">これは Noto Sans JP 本文サンプルです。日本語も対応しています。</p>

  <h1 class="poppins">Poppins 見出しサンプル</h1>
  <p class="rounded">これは M PLUS Rounded 1c 本文サンプルです。柔らかい雰囲気になります。</p>

  <h1 class="playfair">Playfair Display 見出しサンプル</h1>
  <p class="noto-serif">これは Noto Serif JP 本文サンプルです。繊細で美しい印象になります。</p>
</body>
</html>
